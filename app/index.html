<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>PlainHome</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="scroll">
      <header id="topbar">
        <time id="clock" aria-label="Current time">--:--</time>
        <nav id="top-actions" aria-label="Inputs and configuration">
          <button type="button" data-action="config" tabindex="-1">Config</button>
        </nav>
      </header>
      <main id="apps" aria-label="Installed applications"></main>
    </div>
    <div id="status" role="status">Loading apps…</div>
    <div id="notice" hidden></div>
    <div id="confirm" hidden>
      <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
        <h1 id="confirm-title">Remove app?</h1>
        <p id="confirm-message"></p>
        <p class="dialog-help">OK: remove&nbsp;&nbsp;&nbsp; Back: cancel</p>
      </section>
    </div>
    <div id="settings" hidden>
      <section class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <h1 id="settings-title">Settings</h1>
        <button id="time-format" class="settings-option" type="button" tabindex="-1"></button>
        <button id="manage-hidden-apps" class="settings-option" type="button" tabindex="-1"></button>
        <p id="app-version">PlainHome 0.1.17</p>
        <p class="settings-help">Up/Down: select&nbsp;&nbsp;&nbsp; OK: open/change&nbsp;&nbsp;&nbsp; Back: close</p>
      </section>
    </div>
    <div id="hidden-apps" hidden>
      <section class="hidden-apps-panel" role="dialog" aria-modal="true" aria-labelledby="hidden-apps-title">
        <h1 id="hidden-apps-title">Show or hide apps</h1>
        <div id="hidden-app-list"></div>
        <p class="settings-help">OK: show/hide&nbsp;&nbsp;&nbsp; Back: settings</p>
      </section>
    </div>
    <script src="app.js"></script>
  </body>
</html>
